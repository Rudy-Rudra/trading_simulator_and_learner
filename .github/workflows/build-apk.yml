name: Build SimDex APK
 ┃     on:
 ┃       push:
 ┃         branches: [ "main", "master" ]
 ┃       workflow_dispatch: # Allows you to manually click a button to build the APK anytime
 ┃
 ┃     jobs:
 ┃       build:
 ┃         runs-on: ubuntu-latest
 ┃
 ┃         steps:
 ┃           - name: Checkout Code
 ┃             uses: actions/checkout@v4
 ┃
 ┃           - name: Set up JDK 17
 ┃             uses: actions/setup-java@v4
 ┃             with:
 ┃               java-version: '17'
 ┃               distribution: 'temurin'
 ┃
 ┃           - name: Grant Execute Permission to Gradle Wrapper
 ┃             run: chmod +x "mob version/gradlew"
 ┃
 ┃           - name: Build APK with Gradle
 ┃             working-directory: mob version
 ┃             run: ./gradlew assembleDebug --stacktrace
 ┃
 ┃           - name: Upload APK Artifact
 ┃             uses: actions/upload-artifact@v4
 ┃             with:
 ┃               name: SimDex-Pro-Android-APK
 ┃               path: mob version/app/build/outputs/apk/debug/app-debug.apk